name: Remover seção Experiências Reais
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remover-experiencias-reais.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover seção da página
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html,n=re.subn(r'<section\b[^>]*\bid=["\x27]depoimentos["\x27][^>]*>.*?</section>', '', html, count=1, flags=re.S|re.I)
          if not n:
              html,n=re.subn(r'<section\b[^>]*\bclass=["\x27][^"\x27]*testimonial-section[^"\x27]*["\x27][^>]*>.*?</section>', '', html, count=1, flags=re.S|re.I)
          if not n:
              raise SystemExit('Seção de depoimentos não encontrada; nada foi alterado.')
          if 'EXPERIÊNCIAS REAIS' in html.upper():
              raise SystemExit('Ainda há menção a Experiências Reais no HTML')
          p.write_text(html,encoding='utf-8')
          print('Seção removida com sucesso')
          PY
      - name: Salvar página atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Remover seção Experiências Reais" && git push)
