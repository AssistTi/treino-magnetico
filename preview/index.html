<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia da nova página | Treino Magnético</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#130b1b}iframe{display:block;width:100%;height:100%;border:0}#label{position:fixed;z-index:10;bottom:16px;left:16px;background:#20102eea;color:white;border:1px solid #b46af5;border-radius:99px;padding:9px 16px;font:600 12px system-ui;box-shadow:0 8px 30px #0006}</style></head><body><div id="label">PRÉVIA · versão nova, site original preservado</div><iframe title="Nova página de vendas" id="page" src="../index.html"></iframe><script>
const frame=document.getElementById('page');
frame.addEventListener('load',()=>{
try{
const d=frame.contentDocument;
const h=[...d.querySelectorAll('h1,h2,h3')];
const find=s=>h.find(e=>e.textContent.trim().startsWith(s));
const set=(old,text)=>{const e=find(old);if(e)e.textContent=text;return e};
const hero=d.querySelector('h1');
if(hero){hero.textContent='Você treina, se dedica… mas sente que nunca sai do mesmo lugar?';const lead=hero.parentElement.querySelector('p');if(lead)lead.textContent='Você muda o treino, tenta fazer tudo certo e ainda sente que falta alguma coisa. Talvez o próximo passo não seja treinar mais. Seja aprender a treinar com presença e intenção.'}
const pain=set('Você troca de treino','Você começa motivada, mas acaba sempre recomeçando?');
if(pain){const sec=pain.closest('section');if(sec){const desire=d.createElement('section');desire.className='tm-preview-desire';desire.innerHTML='<div class="tm-preview-inner"><span class="tm-preview-kicker">A MUDANÇA COMEÇA ANTES DO ESPELHO</span><h2>Imagina voltar a confiar em você e sentir orgulho de cada treino?</h2><p>Treinar com mais consciência. Saber por que você está ali. Cumprir o que prometeu a si mesma e construir constância, um dia de cada vez.</p><div class="tm-preview-cards"><article><strong>01</strong><h3>Mais presença</h3><p>Sair do automático e prestar atenção em cada movimento.</p></article><article><strong>02</strong><h3>Mais confiança</h3><p>Reconhecer suas pequenas conquistas e confiar no processo.</p></article><article><strong>03</strong><h3>Mais constância</h3><p>Construir uma rotina que não dependa só da motivação.</p></article></div><p class="tm-preview-quote">Não é só sobre mudar o corpo. É sobre a mulher que você está se tornando.</p></div>';sec.after(desire)}}
set('Não é mais um treino.','A mulher que você quer se tornar começa nas escolhas que faz hoje.');
const guide=find('Guia do Treino Magnético');if(guide){const p=guide.parentElement.querySelector('p');if(p)p.textContent='Um guia para aprender a treinar com mais presença, intenção e constância. Leia, pratique e comece a transformar sua relação com o treino.'}
// Mostrar o valor apenas na oferta final, mantendo chamadas anteriores sem preço.
const priceNodes=[];
const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
let node;
while((node=walker.nextNode())){
 if(node.parentElement?.closest('script,style,noscript'))continue;
 if(/(?:R\\$\\s*)?29[,.]90/.test(node.nodeValue))priceNodes.push(node);
}
const offerSections=[...new Set(priceNodes.map(n=>n.parentElement.closest('section,footer,article')||n.parentElement))];
const finalOffer=offerSections[offerSections.length-1]||null;
for(const n of priceNodes){
 const section=n.parentElement.closest('section,footer,article')||n.parentElement;
 if(section===finalOffer)continue;
 const parent=n.parentElement;
 if(parent.closest('a,button')){
  n.nodeValue=n.nodeValue.replace(/(?:POR\\s*)?R\\$\\s*29[,.]90/gi,'').replace(/(?:POR\\s*)?29[,.]90/gi,'').replace(/\\s+→/g,' →').trim();
  if(!n.nodeValue.trim())n.nodeValue='QUERO CONHECER O GUIA';
 }else if(/^\\s*(?:Guia digital\\s*[•·]\\s*)?(?:Acesso por\\s*)?R\\$\\s*29[,.]90\\s*$/i.test(n.nodeValue)){
  parent.style.display='none';
 }else{
  n.nodeValue=n.nodeValue.replace(/(?:R\\$\\s*)29[,.]90/g,'');
 }
}
const style=d.createElement('style');style.textContent=`
:root{scroll-behavior:smooth}body{letter-spacing:-.01em}h1,h2{letter-spacing:-.035em!important;line-height:1.1!important}section{scroll-margin-top:80px}img{max-width:100%}.tm-preview-desire{padding:clamp(65px,9vw,115px) 22px;background:radial-gradient(circle at 80% 15%,#6d2b8c55,transparent 42%),linear-gradient(135deg,#140b1d,#2a113d 65%,#100917);color:#fff;text-align:center}.tm-preview-inner{max-width:1120px;margin:auto}.tm-preview-kicker{font:700 12px system-ui;letter-spacing:.2em;color:#dfb0ff}.tm-preview-desire h2{font-size:clamp(34px,5.5vw,65px)!important;max-width:900px;margin:22px auto!important;color:white!important}.tm-preview-desire>.tm-preview-inner>p{font-size:clamp(17px,2vw,22px);line-height:1.7;color:#e5d9ec;max-width:770px;margin:0 auto 30px}.tm-preview-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:45px auto}.tm-preview-cards article{padding:30px;text-align:left;border-radius:20px;border:1px solid #a16bc066;background:#ffffff0b;transition:transform .7s cubic-bezier(.16,1,.3,1),background .7s}.tm-preview-cards article:hover{transform:translateY(-8px);background:#ffffff18}.tm-preview-cards strong{color:#db9aff}.tm-preview-cards h3{font-size:25px!important;margin:14px 0!important;color:#fff!important}.tm-preview-cards p{line-height:1.65;color:#e5d9ec}.tm-preview-quote{font-size:clamp(23px,3.2vw,38px)!important;font-weight:750;line-height:1.3!important;max-width:840px!important;color:white!important}a.btn,button.btn{transition:transform .65s cubic-bezier(.16,1,.3,1),box-shadow .65s cubic-bezier(.16,1,.3,1)!important}a.btn:hover,button.btn:hover{transform:translateY(-4px)!important;box-shadow:0 16px 38px #8c34ed55!important}@media(max-width:760px){.tm-preview-cards{grid-template-columns:1fr}.tm-preview-cards article{padding:24px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}`;d.head.appendChild(style);
}catch(e){console.warn('Falha na prévia',e)}
});
</script></body></html>
